services:
  backend:
    build:
      context: ./backend
    container_name: karacter-backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      STT_PROVIDER: ${STT_PROVIDER:-whisper}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-deepl}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      args:
        VITE_BACKEND_WS_URL: ${VITE_BACKEND_WS_URL:-http://localhost:8000}
    container_name: karacter-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
